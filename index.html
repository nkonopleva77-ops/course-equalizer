&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Конструктор электронного курса&lt;/div&gt;&lt;h1&gt;Твой курс — твои настройки&lt;/h1&gt;&lt;p class=&quot;intro&quot;&gt;Настрой курс под свою задачу, а не под максимальный бюджет. Выбирай, что важно для результата, и смотри, как меняется твой курс.&lt;/p&gt;&lt;/header&gt;
&lt;div class=&quot;layout&quot;&gt;&lt;section class=&quot;settings&quot; aria-label=&quot;Семь настроек курса&quot;&gt;&lt;div id=&quot;eq-controls&quot;&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; id=&quot;eq-save&quot;&gt;Сохранить вариант А&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; id=&quot;eq-reset&quot;&gt;Начальные настройки&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;result&quot; aria-label=&quot;Результат настройки&quot;&gt;&lt;span class=&quot;demo&quot;&gt;Демонстрационная стоимость&lt;/span&gt;&lt;div id=&quot;eq-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tip&quot;&gt;&lt;h2&gt;Под твою задачу&lt;/h2&gt;&lt;p class=&quot;tip-count&quot; id=&quot;eq-tip-count&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;div id=&quot;eq-tip&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;section id=&quot;eq-more&quot; aria-label=&quot;Другие актуальные рекомендации&quot;&gt;&lt;div id=&quot;eq-tips&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section id=&quot;eq-compare&quot; hidden aria-label=&quot;Сравнение конфигураций&quot;&gt;&lt;div class=&quot;labelrow&quot;&gt;&lt;h2&gt;Два подхода к одной задаче&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; id=&quot;eq-close&quot;&gt;Выйти из сравнения&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pair&quot; id=&quot;eq-pair&quot;&gt;&lt;/div&gt;&lt;p class=&quot;diff&quot; id=&quot;eq-diff&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;eq-replace&quot; class=&quot;cursor-interaction&quot;&gt;Заменить А текущим&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;eq-clear&quot; class=&quot;cursor-interaction&quot;&gt;Сбросить сравнение&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
&lt;p class=&quot;disclaimer&quot;&gt;Пример интерфейса: суммы и заполнение колец условные, не являются коммерческой оценкой. Расчёт носит ориентировочный характер. Окончательная стоимость и сроки разработки определяются после заполнения подробного брифа и согласования объёма работ. Срок уточняется.&lt;/p&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;course-eq&#x27;), $=s=&gt;root.querySelector(s);
const defs=[[&#x27;Продолжительность&#x27;,[&#x27;15 минут&#x27;,&#x27;30 минут&#x27;,&#x27;60 минут&#x27;,&#x27;90 минут&#x27;,&#x27;120 минут&#x27;]],[&#x27;Готовность материалов&#x27;,[&#x27;Готовый сценарий и материалы&#x27;,&#x27;Нужна переработка&#x27;,&#x27;Создаём с нуля&#x27;]],[&#x27;Визуальное оформление&#x27;,[&#x27;Лаконичный&#x27;,&#x27;Фирменный&#x27;,&#x27;Авторский&#x27;,&#x27;Уникальный мир&#x27;]],[&#x27;Интерактивность&#x27;,[&#x27;Базовая&#x27;,&#x27;Разнообразная&#x27;,&#x27;Сценарная&#x27;,&#x27;Продвинутая&#x27;]],[&#x27;Практическая часть&#x27;,[&#x27;Проверяет знания&#x27;,&#x27;Решает кейсы&#x27;,&#x27;Тренирует навыки&#x27;,&#x27;Проходит симуляцию&#x27;]],[&#x27;Геймификация&#x27;,[&#x27;Без игровых элементов&#x27;,&#x27;Лёгкая геймификация&#x27;,&#x27;Сюжетное обучение&#x27;,&#x27;Игровая система&#x27;]],[&#x27;Медиаконтент&#x27;,[&#x27;Статичный&#x27;,&#x27;Динамичный&#x27;,&#x27;Мультимедийный&#x27;,&#x27;Авторское производство&#x27;]]];
const explanations=[[&quot;Короткий урок для одной конкретной задачи. Полезен для точечного объяснения или разбора одной ситуации.&quot;, &quot;Компактный урок с объяснением и практикой. Выбери одну основную рабочую задачу и оставь время на обратную связь.&quot;, &quot;Развёрнутый урок позволяет связать несколько этапов одной задачи. Продумай паузы и чередование объяснений с действиями.&quot;, &quot;Большой объём лучше организовать как несколько самостоятельных уроков с понятными промежуточными результатами.&quot;, &quot;Для такого объёма стоит спроектировать серию уроков. Это поможет распределить практику и возвращаться к нужным темам.&quot;], [&quot;Есть готовый сценарий, тексты и материалы. До сборки стоит проверить актуальность, права на ресурсы и соответствие учебной задаче.&quot;, &quot;Содержание уже есть, но его нужно переработать в структуру курса, задания и понятные участнику объяснения.&quot;, &quot;Нужно определить учебные результаты, собрать содержание с экспертом и разработать сценарий. Это отдельная содержательная работа.&quot;], [&quot;Простое оформление делает акцент на содержании. Подходит, когда иллюстрации должны объяснять, а не создавать отдельный художественный мир.&quot;, &quot;Цвета, шрифты и элементы оформления согласуются с фирменным стилем. Готовые шаблоны можно использовать в серии уроков.&quot;, &quot;Иллюстрации и визуальные решения создаются под содержание курса. Выбирай их там, где они помогают понять ситуацию или действие.&quot;, &quot;Персонажи, локации и целостная художественная среда. Общую визуальную систему стоит создавать один раз и использовать в следующих уроках.&quot;], [&quot;Простые переходы и стандартные задания. Глубина обучения зависит от учебных решений и обратной связи, а не от сложности программирования.&quot;, &quot;Несколько типов взаимодействия с содержанием. Каждый тип стоит выбирать под конкретное действие участника.&quot;, &quot;Выборы участника меняют ход ситуации или доступную информацию. Нужны продуманные ветвления и последствия.&quot;, &quot;Сложные состояния, взаимосвязанные механики или нестандартные взаимодействия. Их необходимость стоит проверить на рабочей задаче.&quot;], [&quot;Вопросы проверяют понимание и запоминание. Для переноса в работу может потребоваться отдельная практика принятия решений.&quot;, &quot;Участник разбирает рабочую ситуацию и выбирает решение. Важны реалистичные альтернативы и объяснение последствий.&quot;, &quot;Участник отрабатывает конкретное действие, получает обратную связь и пробует снова. Сначала определи, какой навык тренируем.&quot;, &quot;Участник действует в модели рабочей ситуации с последствиями решений. Объём симуляции должен соответствовать времени и учебной задаче.&quot;], [&quot;Дополнительные игровые правила не используются. Удерживать внимание могут полезная задача, ясная структура и содержательная практика.&quot;, &quot;Прогресс, достижения или небольшие игровые элементы поддерживают прохождение. Свяжи их с полезными действиями участника.&quot;, &quot;Сюжет связывает учебные ситуации в последовательность. Само наличие персонажей не означает необходимость сложной игровой системы.&quot;, &quot;Игровые правила и состояния влияют на действия участника. Важно, чтобы игра поддерживала учебную задачу, а не отвлекала от неё.&quot;], [&quot;Текст, фотографии, схемы и иллюстрации. Этого может быть достаточно для понятного объяснения и качественной практики.&quot;, &quot;Движение и простая анимация помогают показать процесс или привлечь внимание к существенной детали.&quot;, &quot;Сочетание видео, аудио и других медиа. Для каждого формата стоит определить, что он объясняет лучше статичного материала.&quot;, &quot;Нужны специально созданные видео, озвучка или другие медиаматериалы. Стоит заранее определить их роль, объём и возможность повторного использования.&quot;]];
const initial=[1,1,1,1,1,0,0];let state=initial.slice(), saved=null, comparing=false;
function restore(v){if(!v)return;const good=a=&gt;Array.isArray(a)&amp;&amp;a.length===7&amp;&amp;a.every((n,i)=&gt;Number.isInteger(n)&amp;&amp;n&gt;=0&amp;&amp;n&lt;defs[i][1].length);if(good(v.settings))state=v.settings.slice();if(good(v.saved))saved=v.saved.slice();else saved=null;comparing=!!v.comparing&amp;&amp;!!saved;}
restore(window.openai?.widgetState?.modelContent);
function persist(){window.openai?.setWidgetState?.({modelContent:{settings:state,saved,comparing},privateContent:null})?.catch(()=&gt;{});}
$(&#x27;#eq-controls&#x27;).innerHTML=defs.map((d,i)=&gt;`&lt;div class=&quot;control&quot;&gt;&lt;div class=&quot;labelrow&quot;&gt;&lt;label for=&quot;eq-slider-${i}&quot;&gt;${d[0]}&lt;/label&gt;&lt;output id=&quot;eq-value-${i}&quot; for=&quot;eq-slider-${i}&quot;&gt;&lt;/output&gt;&lt;/div&gt;&lt;p class=&quot;setting-help&quot; id=&quot;eq-help-${i}&quot;&gt;&lt;/p&gt;&lt;input aria-describedby=&quot;eq-help-${i}&quot; id=&quot;eq-slider-${i}&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;${d[1].length-1}&quot; step=&quot;1&quot; value=&quot;${state[i]}&quot;&gt;&lt;div class=&quot;ends&quot;&gt;&lt;span&gt;${d[1][0]}&lt;/span&gt;&lt;span&gt;${d[1].at(-1)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
const names=[&#x27;Стоимость&#x27;,&#x27;Сложность реализации&#x27;,&#x27;Оригинальность&#x27;,&#x27;Методическая глубина&#x27;];
function metrics(s){const n=s.map((v,i)=&gt;v/(defs[i][1].length-1)*100);const cost=Math.round(55+12*s[0]+15*s[1]+22*s[2]+20*s[3]+14*s[4]+12*s[5]+24*s[6]);return{cost,v:[Math.min(100,cost/600*100),.45*n[3]+.2*n[4]+.15*n[5]+.15*n[6]+.05*n[0],.55*n[2]+.25*n[5]+.15*n[3]+.05*n[6],.8*n[4]+.2*n[3]]};}
const words=v=&gt;v&lt;30?&#x27;Низкая&#x27;:v&lt;60?&#x27;Средняя&#x27;:v&lt;80?&#x27;Высокая&#x27;:&#x27;Очень высокая&#x27;;
function rings(s){const m=metrics(s),lower=Math.round(m.cost*.85/5)*5,upper=Math.round(m.cost*1.2/5)*5;return `&lt;div class=&quot;ringwrap&quot;&gt;&lt;svg viewBox=&quot;0 0 320 320&quot; role=&quot;img&quot; aria-label=&quot;Четыре независимые характеристики курса&quot;&gt;${m.v.map((v,i)=&gt;{const r=139-i*22,c=2*Math.PI*r;return `&lt;circle class=&quot;track&quot; cx=&quot;160&quot; cy=&quot;160&quot; r=&quot;${r}&quot;/&gt;&lt;circle class=&quot;arc&quot; style=&quot;stroke:var(--r${i+1});stroke-dasharray:${c*v/100} ${c}&quot; cx=&quot;160&quot; cy=&quot;160&quot; r=&quot;${r}&quot;/&gt;`;}).join(&#x27;&#x27;)}&lt;/svg&gt;&lt;div class=&quot;ringcenter&quot;&gt;&lt;span&gt;Ориентир · демо&lt;/span&gt;&lt;strong&gt;${lower}–${upper} тыс. ₽&lt;/strong&gt;&lt;span&gt;Срок уточняется&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;legend&quot;&gt;${names.map((name,i)=&gt;`&lt;div class=&quot;legendrow&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--r${i+1})&quot;&gt;&lt;/span&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;span class=&quot;level&quot;&gt;${i===0?(m.v[i]&lt;45?&#x27;Умеренная&#x27;:&#x27;Повышенная&#x27;):words(m.v[i])}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function tips(s){let a=[];
const add=(id,title,why,action)=&gt;a.push({id,title,why,action});
if(s[0]===0&amp;&amp;s[4]===3)add(&#x27;short-simulation&#x27;,&#x27;Одна критическая ситуация&#x27;,&#x27;За 15 минут трудно пройти много взаимосвязанных решений и осмыслить последствия.&#x27;,&#x27;Выбери одну критическую рабочую ситуацию и оставь время на разбор результата.&#x27;);
