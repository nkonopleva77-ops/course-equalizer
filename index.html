</head><body><main>
<iframe id="equalizer" title="Эквалайзер курса" sandbox="allow-scripts" referrerpolicy="no-referrer" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ru&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src &#x27;none&#x27;; script-src &#x27;unsafe-inline&#x27;; style-src &#x27;unsafe-inline&#x27;; img-src data:; font-src &#x27;none&#x27;; connect-src &#x27;none&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;&quot;&gt;&lt;style&gt;html{color-scheme:light dark}body{margin:0;padding:0;font-family:Arial,sans-serif}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id=&quot;course-eq&quot;&gt;
&lt;style&gt;
#course-eq{--paper:light-dark(#faf9f6,#171b1b);--surface:light-dark(#ffffff,#222828);--ink:light-dark(#203b36,#e4ede8);--dim:light-dark(#5d7069,#a8bdb4);--line:light-dark(#dfe6df,#3b4943);--accent:light-dark(#2d6653,#91cbb0);--on:light-dark(#fff,#17372a);--soft:light-dark(#edf3ec,#2b3931);--r1:light-dark(#376c58,#8dc9aa);--r2:light-dark(#c38a42,#e1b67e);--r3:light-dark(#8c79ac,#b8a5da);--r4:light-dark(#538b9c,#88bccb);font:14px/1.5 Arial,sans-serif;color:var(--ink);background:var(--paper);border-radius:20px;padding:28px;box-sizing:border-box}
#course-eq *{box-sizing:border-box}#course-eq h1{font-size:32px;line-height:1.15;font-weight:500;margin:12px 0}#course-eq h2{font-size:18px;font-weight:500;margin:0}#course-eq p{margin:0}#course-eq .eyebrow{letter-spacing:2px;font-size:11px;text-transform:uppercase;color:var(--dim)}#course-eq .intro{color:var(--dim);max-width:650px;margin-bottom:24px}#course-eq .layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px}#course-eq .settings{background:var(--surface);padding:22px;border-radius:16px}#course-eq .control{margin-top:19px}#course-eq .control:first-child{margin-top:0}#course-eq .labelrow{display:flex;gap:12px;align-items:baseline;justify-content:space-between}#course-eq label{color:var(--dim);font-size:12px}#course-eq output{text-align:right;font-weight:500}#course-eq input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 0;height:22px}#course-eq .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;gap:12px}#course-eq button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:42px}#course-eq button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}#course-eq .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}#course-eq .result{text-align:center}#course-eq .ringwrap{max-width:310px;margin:0 auto;position:relative}#course-eq .ringwrap svg{display:block;width:100%;height:auto}#course-eq .ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}#course-eq .ringcenter strong{font-size:20px;font-weight:500}#course-eq .ringcenter span{font-size:11px;color:var(--dim)}#course-eq .track{fill:none;stroke:var(--line);stroke-width:9;opacity:.55}#course-eq .arc{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:160px 160px;transition:stroke-dasharray .35s}#course-eq .legend{display:grid;gap:8px;text-align:left;margin:4px 0 20px}#course-eq .legendrow{display:flex;align-items:center;gap:9px}#course-eq .dot{width:9px;height:9px;border-radius:50%;flex:none}#course-eq .level{margin-left:auto;color:var(--dim);font-size:12px}#course-eq .tip{text-align:left;background:var(--soft);padding:15px;border-radius:12px}#course-eq .tip p{margin-top:5px;color:var(--dim);font-size:13px}#course-eq details{margin-top:8px;font-size:12px;color:var(--dim)}#course-eq summary{cursor:pointer}#course-eq .disclaimer{margin-top:22px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);padding-top:14px}#course-eq .demo{display:inline-block;background:var(--soft);color:var(--dim);padding:4px 8px;border-radius:6px;font-size:11px;margin-bottom:6px}#course-eq #eq-compare{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}#course-eq .pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}#course-eq .comparecard{background:var(--surface);padding:16px;border-radius:14px}#course-eq .comparecard .ringwrap{max-width:220px}#course-eq .comparecard .ringcenter strong{font-size:15px}#course-eq .comparecard ul{padding-left:18px;color:var(--dim);font-size:12px}#course-eq .comparecard .legend{font-size:12px}#course-eq .comparecard .level{font-size:11px}#course-eq .diff{margin-top:14px;color:var(--dim)}#course-eq [hidden]{display:none!important}@media(max-width:650px){#course-eq{padding:18px}#course-eq h1{font-size:27px}#course-eq .layout,#course-eq .pair{grid-template-columns:1fr}#course-eq .settings{padding:16px}#course-eq .labelrow{flex-wrap:wrap;gap:0}#course-eq output{margin-left:auto}#course-eq .result{padding-top:4px}}@media(prefers-reduced-motion:reduce){#course-eq .arc{transition:none}}
&lt;/style&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Конструктор электронного курса&lt;/div&gt;&lt;h1&gt;Твой курс — твои настройки&lt;/h1&gt;&lt;p class=&quot;intro&quot;&gt;Настрой курс под свою задачу, а не под максимальный бюджет. Выбирай, что важно для результата, и смотри, как меняется твой курс.&lt;/p&gt;&lt;/header&gt;
&lt;div class=&quot;layout&quot;&gt;&lt;section class=&quot;settings&quot; aria-label=&quot;Семь настроек курса&quot;&gt;&lt;div id=&quot;eq-controls&quot;&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; id=&quot;eq-save&quot;&gt;Сохранить вариант А&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; id=&quot;eq-reset&quot;&gt;Начальные настройки&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;result&quot; aria-label=&quot;Результат настройки&quot;&gt;&lt;span class=&quot;demo&quot;&gt;Демонстрационная стоимость&lt;/span&gt;&lt;div id=&quot;eq-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tip&quot;&gt;&lt;strong&gt;Под твою задачу&lt;/strong&gt;&lt;p id=&quot;eq-tip&quot;&gt;&lt;/p&gt;&lt;details id=&quot;eq-more&quot;&gt;&lt;summary&gt;Другие рекомендации&lt;/summary&gt;&lt;div id=&quot;eq-tips&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section id=&quot;eq-compare&quot; hidden aria-label=&quot;Сравнение конфигураций&quot;&gt;&lt;div class=&quot;labelrow&quot;&gt;&lt;h2&gt;Два подхода к одной задаче&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; id=&quot;eq-close&quot;&gt;Выйти из сравнения&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pair&quot; id=&quot;eq-pair&quot;&gt;&lt;/div&gt;&lt;p class=&quot;diff&quot; id=&quot;eq-diff&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;eq-replace&quot; class=&quot;cursor-interaction&quot;&gt;Заменить А текущим&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;eq-clear&quot; class=&quot;cursor-interaction&quot;&gt;Сбросить сравнение&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
&lt;p class=&quot;disclaimer&quot;&gt;Пример интерфейса: суммы и заполнение колец условные, не являются коммерческой оценкой. Расчёт носит ориентировочный характер. Окончательная стоимость и сроки разработки определяются после заполнения подробного брифа и согласования объёма работ. Срок уточняется.&lt;/p&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;course-eq&#x27;), $=s=&gt;root.querySelector(s);
const defs=[[&#x27;Продолжительность&#x27;,[&#x27;15 минут&#x27;,&#x27;30 минут&#x27;,&#x27;60 минут&#x27;,&#x27;90 минут&#x27;,&#x27;120 минут&#x27;]],[&#x27;Готовность материалов&#x27;,[&#x27;Готовый сценарий и материалы&#x27;,&#x27;Нужна переработка&#x27;,&#x27;Создаём с нуля&#x27;]],[&#x27;Визуальное оформление&#x27;,[&#x27;Лаконичный&#x27;,&#x27;Фирменный&#x27;,&#x27;Авторский&#x27;,&#x27;Уникальный мир&#x27;]],[&#x27;Интерактивность&#x27;,[&#x27;Базовая&#x27;,&#x27;Разнообразная&#x27;,&#x27;Сценарная&#x27;,&#x27;Продвинутая&#x27;]],[&#x27;Практическая часть&#x27;,[&#x27;Проверяет знания&#x27;,&#x27;Решает кейсы&#x27;,&#x27;Тренирует навыки&#x27;,&#x27;Проходит симуляцию&#x27;]],[&#x27;Геймификация&#x27;,[&#x27;Без игровых элементов&#x27;,&#x27;Лёгкая геймификация&#x27;,&#x27;Сюжетное обучение&#x27;,&#x27;Игровая система&#x27;]],[&#x27;Медиаконтент&#x27;,[&#x27;Статичный&#x27;,&#x27;Динамичный&#x27;,&#x27;Мультимедийный&#x27;,&#x27;Авторское производство&#x27;]]];
const initial=[1,1,1,1,1,0,0];let state=initial.slice(), saved=null, comparing=false;
function restore(v){if(!v)return;const good=a=&gt;Array.isArray(a)&amp;&amp;a.length===7&amp;&amp;a.every((n,i)=&gt;Number.isInteger(n)&amp;&amp;n&gt;=0&amp;&amp;n&lt;defs[i][1].length);if(good(v.settings))state=v.settings.slice();if(good(v.saved))saved=v.saved.slice();else saved=null;comparing=!!v.comparing&amp;&amp;!!saved;}
restore(window.openai?.widgetState?.modelContent);
function persist(){window.openai?.setWidgetState?.({modelContent:{settings:state,saved,comparing},privateContent:null})?.catch(()=&gt;{});}
$(&#x27;#eq-controls&#x27;).innerHTML=defs.map((d,i)=&gt;`&lt;div class=&quot;control&quot;&gt;&lt;div class=&quot;labelrow&quot;&gt;&lt;label for=&quot;eq-slider-${i}&quot;&gt;${d[0]}&lt;/label&gt;&lt;output id=&quot;eq-value-${i}&quot; for=&quot;eq-slider-${i}&quot;&gt;&lt;/output&gt;&lt;/div&gt;&lt;input id=&quot;eq-slider-${i}&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;${d[1].length-1}&quot; step=&quot;1&quot; value=&quot;${state[i]}&quot;&gt;&lt;div class=&quot;ends&quot;&gt;&lt;span&gt;${d[1][0]}&lt;/span&gt;&lt;span&gt;${d[1].at(-1)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
const names=[&#x27;Стоимость&#x27;,&#x27;Сложность реализации&#x27;,&#x27;Оригинальность&#x27;,&#x27;Методическая глубина&#x27;];
function metrics(s){const n=s.map((v,i)=&gt;v/(defs[i][1].length-1)*100);const cost=Math.round(55+12*s[0]+15*s[1]+22*s[2]+20*s[3]+14*s[4]+12*s[5]+24*s[6]);return{cost,v:[Math.min(100,cost/600*100),.45*n[3]+.2*n[4]+.15*n[5]+.15*n[6]+.05*n[0],.55*n[2]+.25*n[5]+.15*n[3]+.05*n[6],.8*n[4]+.2*n[3]]};}
const words=v=&gt;v&lt;30?&#x27;Низкая&#x27;:v&lt;60?&#x27;Средняя&#x27;:v&lt;80?&#x27;Высокая&#x27;:&#x27;Очень высокая&#x27;;
function rings(s){const m=metrics(s),lower=Math.round(m.cost*.85/5)*5,upper=Math.round(m.cost*1.2/5)*5;return `&lt;div class=&quot;ringwrap&quot;&gt;&lt;svg viewBox=&quot;0 0 320 320&quot; role=&quot;img&quot; aria-label=&quot;Четыре независимые характеристики курса&quot;&gt;${m.v.map((v,i)=&gt;{const r=139-i*22,c=2*Math.PI*r;return `&lt;circle class=&quot;track&quot; cx=&quot;160&quot; cy=&quot;160&quot; r=&quot;${r}&quot;/&gt;&lt;circle class=&quot;arc&quot; style=&quot;stroke:var(--r${i+1});stroke-dasharray:${c*v/100} ${c}&quot; cx=&quot;160&quot; cy=&quot;160&quot; r=&quot;${r}&quot;/&gt;`;}).join(&#x27;&#x27;)}&lt;/svg&gt;&lt;div class=&quot;ringcenter&quot;&gt;&lt;span&gt;Ориентир · демо&lt;/span&gt;&lt;strong&gt;${lower}–${upper} тыс. ₽&lt;/strong&gt;&lt;span&gt;Срок уточняется&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;legend&quot;&gt;${names.map((name,i)=&gt;`&lt;div class=&quot;legendrow&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--r${i+1})&quot;&gt;&lt;/span&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;span class=&quot;level&quot;&gt;${i===0?(m.v[i]&lt;45?&#x27;Умеренная&#x27;:&#x27;Повышенная&#x27;):words(m.v[i])}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function tips(s){let a=[];if(s[0]===0&amp;&amp;s[4]===3)a.push(&#x27;Для короткой симуляции сосредоточься на одной критической рабочей ситуации.&#x27;);if(s[0]&gt;=3)a.push(&#x27;Рассмотри разделение курса на несколько уроков.&#x27;);if(s[3]&gt;=2&amp;&amp;s[4]===0)a.push(&#x27;Проверь, нужны ли сложные технические механики для простой проверки знаний.&#x27;);if(s[3]===0&amp;&amp;s[4]&gt;=2)a.push(&#x27;Качественную тренировку навыков можно спроектировать без сложного программирования.&#x27;);if(s[2]===3&amp;&amp;s[5]===2)a.push(&#x27;Повторно используй персонажей и локации в серии уроков.&#x27;);if(s[6]===3&amp;&amp;s[0]&lt;=1)a.push(&#x27;Рассмотри иллюстрации и простую анимацию вместо оригинального видео.&#x27;);if(s[1]===2)a.push(&#x27;Создание материалов с нуля увеличивает объём методической и сценарной работы.&#x27;);return a;}
function render(){defs.forEach((d,i)=&gt;{$(`#eq-slider-${i}`).value=state[i];$(`#eq-slider-${i}`).setAttribute(&#x27;aria-valuetext&#x27;,d[1][state[i]]);$(`#eq-value-${i}`).textContent=d[1][state[i]];});$(&#x27;#eq-result&#x27;).innerHTML=rings(state);const t=tips(state);$(&#x27;#eq-tip&#x27;).textContent=t[0]||&#x27;Сохрани этот вариант и попробуй другое сочетание настроек. Более дорогой курс не означает более эффективный.&#x27;;$(&#x27;#eq-more&#x27;).hidden=t.length&lt;2;$(&#x27;#eq-tips&#x27;).innerHTML=t.slice(1).map(x=&gt;`&lt;p&gt;${x}&lt;/p&gt;`).join(&#x27;&#x27;);$(&#x27;#eq-save&#x27;).textContent=saved?&#x27;Сравнить с вариантом А&#x27;:&#x27;Сохранить вариант А&#x27;;$(&#x27;#eq-compare&#x27;).hidden=!comparing;
if(comparing&amp;&amp;saved){$(&#x27;#eq-pair&#x27;).innerHTML=[saved,state].map((s,i)=&gt;`&lt;article class=&quot;comparecard&quot;&gt;&lt;h2&gt;${i?&#x27;Б · Текущий вариант&#x27;:&#x27;А · Сохранённый вариант&#x27;}&lt;/h2&gt;${rings(s)}&lt;ul&gt;${defs.map((d,j)=&gt;`&lt;li&gt;${d[0]}: ${d[1][s[j]]}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/article&gt;`).join(&#x27;&#x27;);let changed=defs.filter((d,i)=&gt;state[i]!==saved[i]).map(d=&gt;d[0].toLowerCase());$(&#x27;#eq-diff&#x27;).textContent=changed.length?&#x27;Изменились: &#x27;+changed.join(&#x27;, &#x27;)+&#x27;. Кольца показывают характеристики, а не общий рейтинг качества.&#x27;:&#x27;Настройки совпадают. Измени ползунки, чтобы сравнить два подхода.&#x27;;}}
defs.forEach((d,i)=&gt;$(`#eq-slider-${i}`).addEventListener(&#x27;input&#x27;,e=&gt;{state[i]=Number(e.target.value);render();persist();}));
$(&#x27;#eq-save&#x27;).onclick=()=&gt;{if(!saved)saved=state.slice();comparing=true;render();persist();};$(&#x27;#eq-reset&#x27;).onclick=()=&gt;{state=initial.slice();render();persist();};$(&#x27;#eq-close&#x27;).onclick=()=&gt;{comparing=false;render();persist();};$(&#x27;#eq-replace&#x27;).onclick=()=&gt;{saved=state.slice();render();persist();};$(&#x27;#eq-clear&#x27;).onclick=()=&gt;{saved=null;comparing=false;render();persist();};
window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{const v=e.detail?.globals?.widgetState;if(v){restore(v.modelContent);render();}});render();
})();
&lt;/script&gt;
&lt;/div&gt;

(()=&gt;{const send=()=&gt;parent.postMessage({type:&#x27;equalizer-height&#x27;,height:Math.ceil(document.documentElement.getBoundingClientRect().height)},&#x27;*&#x27;);new ResizeObserver(send).observe(document.body);window.addEventListener(&#x27;load&#x27;,send);send();})();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
</main><script>
const frame=document.getElementById('equalizer');
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.type!=='equalizer-height')return;const h=event.data.height;if(typeof h==='number'&&Number.isFinite(h)&&h>0&&h<30000){frame.style.height=Math.ceil(h)+'px';frame.style.minHeight='0';}});
</script></body></html>
